services:
  db:
    container_name: weathermood-db-prod
    restart: unless-stopped
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:          
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-prod: